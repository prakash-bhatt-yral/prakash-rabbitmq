name: deploy-rabbitmq

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_NAME: prakash-1
      NODE_IP: 94.130.13.115
      SERVER_1_IP: 94.130.13.115
      SERVER_2_IP: 88.99.151.102
      SERVER_3_IP: 138.201.129.173
      RABBITMQ_ERLANG_COOKIE: dummy
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Validate config
        run: bash scripts/validate-rabbitmq-config.sh

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - name: prakash-1
            ip: 94.130.13.115
            ssh_host: 94.130.13.115
          - name: prakash-2
            ip: 88.99.151.102
            ssh_host: 88.99.151.102
          - name: prakash-3
            ip: 138.201.129.173
            ssh_host: 138.201.129.173
    env:
      DEPLOY_DIR: ~/prakash-rabbitmq
      SERVER_1_IP: 94.130.13.115
      SERVER_2_IP: 88.99.151.102
      SERVER_3_IP: 138.201.129.173
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${RABBITMQ_DEPLOY_SSH_KEY}" > ~/.ssh/rabbitmq_deploy
          chmod 600 ~/.ssh/rabbitmq_deploy
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ matrix.node.ssh_host }}
          RABBITMQ_DEPLOY_SSH_KEY: ${{ secrets.RABBITMQ_DEPLOY_SSH_KEY }}

      - name: Package repo
        run: tar --exclude=.git --exclude=rabbitmq/runtime -czf /tmp/prakash-rabbitmq.tar.gz .

      - name: Upload repo
        run: |
          set -euo pipefail
          scp -i ~/.ssh/rabbitmq_deploy /tmp/prakash-rabbitmq.tar.gz \
            "${RABBITMQ_DEPLOY_USER}@${SSH_HOST}:/tmp/prakash-rabbitmq.tar.gz"
        env:
          SSH_HOST: ${{ matrix.node.ssh_host }}
          RABBITMQ_DEPLOY_USER: ${{ secrets.RABBITMQ_DEPLOY_USER }}

      - name: Deploy node
        run: |
          set -euo pipefail
          node_env="$(mktemp)"
          {
            printf 'DEPLOY_DIR=%q\n' "${DEPLOY_DIR}"
            printf 'NODE_NAME=%q\n' "${NODE_NAME}"
            printf 'NODE_IP=%q\n' "${NODE_IP}"
            printf 'SERVER_1_IP=%q\n' "${SERVER_1_IP}"
            printf 'SERVER_2_IP=%q\n' "${SERVER_2_IP}"
            printf 'SERVER_3_IP=%q\n' "${SERVER_3_IP}"
            printf 'RABBITMQ_DIRECT_AMQPS_CLIENT_IPS=%q\n' "${RABBITMQ_DIRECT_AMQPS_CLIENT_IPS}"
            printf 'RABBITMQ_ERLANG_COOKIE=%q\n' "${RABBITMQ_ERLANG_COOKIE}"
            printf 'RABBITMQ_TLS_CERT_PEM_B64=%q\n' "${RABBITMQ_TLS_CERT_PEM_B64}"
            printf 'RABBITMQ_TLS_KEY_PEM_B64=%q\n' "${RABBITMQ_TLS_KEY_PEM_B64}"
          } > "${node_env}"
          scp -i ~/.ssh/rabbitmq_deploy "${node_env}" \
            "${RABBITMQ_DEPLOY_USER}@${SSH_HOST}:/tmp/prakash-rabbitmq-node.env"
          rm -f "${node_env}"
          ssh -i ~/.ssh/rabbitmq_deploy "${RABBITMQ_DEPLOY_USER}@${SSH_HOST}" bash -se <<'REMOTE'
          set -euo pipefail
          set -a
          . /tmp/prakash-rabbitmq-node.env
          set +a
          mkdir -p "${DEPLOY_DIR}"
          tar -xzf /tmp/prakash-rabbitmq.tar.gz -C "${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"
          rm -f /tmp/prakash-rabbitmq-node.env
          bash scripts/deploy-rabbitmq.sh
          REMOTE
        env:
          SSH_HOST: ${{ matrix.node.ssh_host }}
          NODE_NAME: ${{ matrix.node.name }}
          NODE_IP: ${{ matrix.node.ip }}
          SERVER_1_IP: ${{ env.SERVER_1_IP }}
          SERVER_2_IP: ${{ env.SERVER_2_IP }}
          SERVER_3_IP: ${{ env.SERVER_3_IP }}
          RABBITMQ_DIRECT_AMQPS_CLIENT_IPS: ${{ vars.RABBITMQ_DIRECT_AMQPS_CLIENT_IPS }}
          RABBITMQ_DEPLOY_USER: ${{ secrets.RABBITMQ_DEPLOY_USER }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          RABBITMQ_TLS_CERT_PEM_B64: ${{ secrets.RABBITMQ_TLS_CERT_PEM_B64 }}
          RABBITMQ_TLS_KEY_PEM_B64: ${{ secrets.RABBITMQ_TLS_KEY_PEM_B64 }}

  apply-topology:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ~/prakash-rabbitmq
      TOPOLOGY_NODE_NAME: prakash-1
      TOPOLOGY_SSH_HOST: 94.130.13.115
      SERVER_1_IP: 94.130.13.115
      SERVER_2_IP: 88.99.151.102
      SERVER_3_IP: 138.201.129.173
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${RABBITMQ_DEPLOY_SSH_KEY}" > ~/.ssh/rabbitmq_deploy
          chmod 600 ~/.ssh/rabbitmq_deploy
          ssh-keyscan -H "${TOPOLOGY_SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          RABBITMQ_DEPLOY_SSH_KEY: ${{ secrets.RABBITMQ_DEPLOY_SSH_KEY }}

      - name: Apply topology
        run: |
          set -euo pipefail
          topology_env="$(mktemp)"
          {
            printf 'DEPLOY_DIR=%q\n' "${DEPLOY_DIR}"
            printf 'NODE_NAME=%q\n' "${TOPOLOGY_NODE_NAME}"
            printf 'SERVER_1_IP=%q\n' "${SERVER_1_IP}"
            printf 'SERVER_2_IP=%q\n' "${SERVER_2_IP}"
            printf 'SERVER_3_IP=%q\n' "${SERVER_3_IP}"
            printf 'RABBITMQ_ERLANG_COOKIE=%q\n' "${RABBITMQ_ERLANG_COOKIE}"
            printf 'RABBITMQ_PUBLISHER_PASSWORD=%q\n' "${RABBITMQ_PUBLISHER_PASSWORD}"
            printf 'RABBITMQ_CONSUMER_PASSWORD=%q\n' "${RABBITMQ_CONSUMER_PASSWORD}"
            printf 'RABBITMQ_ADMIN_PASSWORD=%q\n' "${RABBITMQ_ADMIN_PASSWORD}"
          } > "${topology_env}"
          scp -i ~/.ssh/rabbitmq_deploy "${topology_env}" \
            "${RABBITMQ_DEPLOY_USER}@${TOPOLOGY_SSH_HOST}:/tmp/prakash-rabbitmq-topology.env"
          rm -f "${topology_env}"
          ssh -i ~/.ssh/rabbitmq_deploy "${RABBITMQ_DEPLOY_USER}@${TOPOLOGY_SSH_HOST}" bash -se <<'REMOTE'
          set -euo pipefail
          set -a
          . /tmp/prakash-rabbitmq-topology.env
          set +a
          cd "${DEPLOY_DIR}"
          rm -f /tmp/prakash-rabbitmq-topology.env
          bash scripts/apply-rabbitmq-topology.sh
          REMOTE
        env:
          RABBITMQ_DEPLOY_USER: ${{ secrets.RABBITMQ_DEPLOY_USER }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          RABBITMQ_PUBLISHER_PASSWORD: ${{ secrets.RABBITMQ_PUBLISHER_PASSWORD }}
          RABBITMQ_CONSUMER_PASSWORD: ${{ secrets.RABBITMQ_CONSUMER_PASSWORD }}
          RABBITMQ_ADMIN_PASSWORD: ${{ secrets.RABBITMQ_ADMIN_PASSWORD }}
