services:
  firewall:
    image: alpine:3
    privileged: true
    network_mode: host
    restart: always
    environment:
      SERVER_1_IP: "${SERVER_1_IP}"
      SERVER_2_IP: "${SERVER_2_IP}"
      SERVER_3_IP: "${SERVER_3_IP}"
      VAST_WORKER_IPS: "${VAST_WORKER_IPS:-}"
    volumes:
      - ../scripts/apply-firewall.sh:/apply-firewall.sh:ro
    command: sh -c "apk add --no-cache iptables ip6tables && sh /apply-firewall.sh"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: "${NODE_NAME}"
    environment:
      RABBITMQ_NODENAME: "rabbit@${NODE_NAME}"
      RABBITMQ_USE_LONGNAME: "false"
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE}"
      RABBITMQ_CONFIG_FILE: "/etc/rabbitmq/rabbitmq"
      RABBITMQ_ENABLED_PLUGINS_FILE: "/etc/rabbitmq/enabled_plugins"
    extra_hosts:
      - "prakash-1:${SERVER_1_IP}"
      - "prakash-2:${SERVER_2_IP}"
      - "prakash-3:${SERVER_3_IP}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./runtime/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./runtime/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./runtime/tls:/etc/rabbitmq/tls:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5671:5671"
      - "15672:15672"
      - "4369:4369"
      - "25672:25672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: always
    depends_on:
      firewall:
        condition: service_started

volumes:
  rabbitmq_data:
