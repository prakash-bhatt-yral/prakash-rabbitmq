services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: "${NODE_NAME:?NODE_NAME is required}"
    environment:
      RABBITMQ_NODENAME: "rabbit@${NODE_NAME:?NODE_NAME is required}"
      RABBITMQ_USE_LONGNAME: "false"
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?RABBITMQ_ERLANG_COOKIE is required}"
      RABBITMQ_CONFIG_FILE: "/etc/rabbitmq/rabbitmq"
      RABBITMQ_ENABLED_PLUGINS_FILE: "/etc/rabbitmq/enabled_plugins"
    extra_hosts:
      - "prakash-1:${SERVER_1_IP:?SERVER_1_IP is required}"
      - "prakash-2:${SERVER_2_IP:?SERVER_2_IP is required}"
      - "prakash-3:${SERVER_3_IP:?SERVER_3_IP is required}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./runtime/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./runtime/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./runtime/tls:/etc/rabbitmq/tls:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5671:5671"
      - "127.0.0.1:15672:15672"
      - "4369:4369"
      - "25672:25672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: always

volumes:
  rabbitmq_data:
